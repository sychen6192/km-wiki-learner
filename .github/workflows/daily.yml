name: daily-wiki-loop

on:
  schedule:
    - cron: "30 21 * * *" # 05:30 Asia/Taipei (UTC+8)
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional — deep-dive this topic now instead of the regular daily loop"
        required: false
        default: ""

concurrency:
  group: km-wiki-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    # 20 min of vision (KM_EXTRACT_BUDGET_SEC) + one page in flight + 60 min of
    # agent + 15 min repair pass, with room to spare.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # Without these, a scanned PDF dropped into Raw/ is silently unreadable on
      # CI even though it works on the laptop. Add language packs here to match
      # the material you actually feed it.
      - name: Install document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-jpn

      # Scans and homework photos are read by Claude (KM_VISION_MODEL below),
      # which tools/extract.py reaches through the official SDK. OCR cannot see
      # red ink, so without this the corrections never reach the wiki.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK
        run: python -m pip install --quiet anthropic

      # Every run starts from a fresh checkout, so without this every page in
      # Raw/ would be sent to the vision model again every day. extract.py
      # matches cached text to its source by content hash and recipe, so a
      # restored cache is only used where it is still right.
      - name: Restore extracted text
        uses: actions/cache/restore@v4
        with:
          path: loop/state/extracted
          key: extracted-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: extracted-

      - name: Configure git identity
        run: |
          git config user.name "km-wiki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run daily loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KM_MODEL: ${{ vars.KM_MODEL || 'anthropic/claude-sonnet-4-5' }}
          KM_VISION_MODEL: ${{ vars.KM_VISION_MODEL || 'anthropic/claude-opus-5-5' }}
          # A big backlog (or a prompt change, which re-reads every page) is
          # spread over several days instead of eating the agent's time.
          KM_EXTRACT_BUDGET_SEC: ${{ vars.KM_EXTRACT_BUDGET_SEC || '1200' }}
          KM_MAX_ITEMS: ${{ vars.KM_MAX_ITEMS || '3' }}
          KM_TOPIC: ${{ inputs.topic }}
        run: ./loop/daily.sh

      # Saved under a fresh key every run and every re-run attempt (caches are
      # immutable once written), and even when the loop failed: pages already
      # paid for stay paid for.
      - name: Save extracted text
        if: always()
        uses: actions/cache/save@v4
        with:
          path: loop/state/extracted
          key: extracted-${{ github.run_id }}-${{ github.run_attempt }}
