name: daily-wiki-loop

on:
  schedule:
    - cron: "30 21 * * *" # 05:30 Asia/Taipei (UTC+8)
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional — deep-dive this topic now instead of the regular daily loop"
        required: false
        default: ""

concurrency:
  group: km-wiki-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config user.name "km-wiki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run daily loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KM_MODEL: ${{ vars.KM_MODEL || 'anthropic/claude-sonnet-4-5' }}
          KM_MAX_ITEMS: ${{ vars.KM_MAX_ITEMS || '3' }}
          KM_TOPIC: ${{ inputs.topic }}
        run: ./loop/daily.sh
